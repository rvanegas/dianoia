
server {
    listen       80;
    server_name  dianoia.rvanegas.com;

    return 301 https//$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dianoia.rvanegas.com;

    ssl_certificate /etc/letsencrupt/live/dianoia.rvanegas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dianoia.rvanegas.com/privkey.pem;

    ssl_protocols TSLv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
