[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dianoia"
version = "0.1.5"
description = "AI-powered argumentation server and CLI."
requires-python = ">=3.11"
dependencies = ["platformdirs"]

[project.scripts]
dianoia = "cli.argue:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "cli*", "config*", "core*", "schemas*", "services*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = []
